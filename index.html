<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Night Royale 💸</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --cyan: #7df0ff;
      --cyan-2: #22d3ee;
      --purple: #c4b5fd;
      --violet: #7c3aed;
      --text: #f7f8ff;
      --muted: rgba(226, 232, 255, 0.78);
      --ok: #86efac;
      --danger: #fda4af;
      --glass: rgba(8, 10, 28, 0.55);
      --glass-2: rgba(6, 8, 22, 0.72);
      --nav-h: 78px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; max-width: 100%; overflow-x: hidden; }

    body {
      font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      min-height: 100dvh;
      background-color: #03040c;
      background-image:
        linear-gradient(180deg, rgba(2, 4, 16, 0.78) 0%, rgba(8, 6, 24, 0.72) 42%, rgba(4, 8, 22, 0.82) 100%),
        url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(700px 420px at 88% -8%, rgba(124, 58, 237, 0.28), transparent 58%),
        radial-gradient(560px 380px at -10% 18%, rgba(34, 211, 238, 0.16), transparent 55%);
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      padding: 18px 16px calc(var(--nav-h) + var(--safe-b) + 18px);
      max-width: 480px;
      margin: 0 auto;
    }

    .badge {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(72vw, 280px);
      padding: 7px 11px 7px 7px;
      border-radius: 999px;
      background: var(--glass-2);
      border: 1px solid rgba(125, 240, 255, 0.4);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 0 22px rgba(125, 240, 255, 0.18);
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 760;
      font-size: 14px;
      color: #071018;
      background: linear-gradient(145deg, var(--cyan), var(--violet));
      box-shadow: 0 0 12px rgba(125, 240, 255, 0.45);
      flex-shrink: 0;
    }
    .badge-meta { min-width: 0; }
    .badge-name {
      font-size: 12px;
      font-weight: 680;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-id {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero { padding-right: 118px; margin-bottom: 16px; }
    .kicker {
      margin: 0 0 6px;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--purple);
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 760;
      letter-spacing: -.03em;
      text-shadow: 0 0 22px rgba(125, 240, 255, 0.28);
    }

    .glass {
      background: var(--glass);
      border: 1px solid rgba(125, 240, 255, 0.32);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow:
        0 0 28px rgba(124, 58, 237, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .balance-card {
      position: relative;
      overflow: hidden;
      padding: 22px 20px 18px;
      border-radius: 24px;
    }
    .balance-card.pulse { animation: pulseGlow .95s ease; }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 rgba(125, 240, 255, 0); }
      40% { box-shadow: 0 0 46px rgba(125, 240, 255, .5); }
      100% { box-shadow: 0 0 28px rgba(124, 58, 237, 0.18); }
    }
    .balance-label {
      margin: 0;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .balance-row { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
    .balance-value {
      font-size: 40px;
      font-weight: 780;
      letter-spacing: -.04em;
      line-height: 1;
      background: linear-gradient(92deg, #fff 10%, var(--cyan) 55%, var(--purple) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .balance-unit { color: var(--cyan); font-weight: 700; font-size: 18px; }
    .balance-hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
    .admin-chip {
      display: none;
      margin-top: 12px;
      width: fit-content;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      color: var(--purple);
      border: 1px solid rgba(196, 181, 253, .45);
      background: rgba(124, 58, 237, .16);
    }
    .admin-chip.show { display: inline-flex; }

    .tabs-wrap { margin-top: 18px; }
    .panel { display: none; animation: fadeSlide .3s ease; }
    .panel.active { display: block; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .section-title { margin: 0 0 12px; font-size: 15px; font-weight: 680; }
    .task-list, .stack { display: flex; flex-direction: column; gap: 12px; }
    .card { padding: 16px; border-radius: 20px; }
    .task-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .task-title { margin: 0; font-size: 15px; font-weight: 700; }
    .task-desc { margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
    .reward {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 760;
      color: var(--cyan);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(125, 240, 255, .4);
      background: rgba(34, 211, 238, .12);
      box-shadow: 0 0 12px rgba(125, 240, 255, .15);
    }

    .btn {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 760;
      color: #071018;
      background: linear-gradient(135deg, var(--cyan) 0%, #a78bfa 100%);
      box-shadow: 0 0 22px rgba(125, 240, 255, .32);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .btn:hover { filter: brightness(1.06); box-shadow: 0 0 28px rgba(125, 240, 255, .48); }
    .btn:active { transform: scale(.97); }
    .btn:disabled {
      cursor: default;
      transform: none;
      filter: none;
      color: var(--ok);
      background: rgba(134, 239, 172, .12);
      border: 1px solid rgba(134, 239, 172, .3);
      box-shadow: none;
    }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .btn-row .btn { margin-top: 0; }
    .btn.ghost {
      color: var(--text);
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(125, 240, 255, .28);
      box-shadow: none;
    }

    .ref-link { margin: 10px 0 0; word-break: break-all; font-size: 13px; color: var(--cyan); line-height: 1.45; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { padding: 14px; text-align: center; }
    .stat b { display: block; font-size: 22px; color: var(--cyan); }
    .stat span { font-size: 11px; color: var(--muted); }

    label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .field { margin-bottom: 12px; }
    input {
      width: 100%;
      border: 1px solid rgba(125, 240, 255, .22);
      background: rgba(2, 6, 20, .55);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 16px;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, .14), 0 0 18px rgba(125, 240, 255, .18);
    }
    .error { min-height: 18px; margin: 0 0 8px; font-size: 12px; color: var(--danger); }

    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px 12px calc(10px + var(--safe-b));
      background: rgba(4, 6, 20, .82);
      border-top: 1px solid rgba(125, 240, 255, 0.18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .nav-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 6px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 680;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .nav-btn.active {
      color: var(--text);
      background: linear-gradient(180deg, rgba(34, 211, 238, .18), rgba(124, 58, 237, .16));
      box-shadow: 0 0 16px rgba(125, 240, 255, .16);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--glass-2);
      border: 1px solid rgba(125, 240, 255, .35);
      backdrop-filter: blur(16px);
      font-size: 13px;
      white-space: nowrap;
      transition: .28s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="badge" id="profileBadge">
    <div class="avatar" id="avatar">N</div>
    <div class="badge-meta">
      <div class="badge-name" id="userName">Night Royale 💸</div>
      <div class="badge-id" id="userId">ID: —</div>
    </div>
  </div>

  <main class="app">
    <header class="hero">
      <p class="kicker">Moonlight Glow</p>
      <h1>Night Royale 💸</h1>
    </header>

    <section class="balance-card glass" id="balanceCard">
      <p class="balance-label">Баланс, UAH</p>
      <div class="balance-row">
        <div class="balance-value" id="balanceValue">0.00</div>
        <div class="balance-unit">₴</div>
      </div>
      <p class="balance-hint">Завдання, друзі й виплата — виключно в гривнях.</p>
      <div class="admin-chip" id="adminChip">Адмін-доступ активний</div>
    </section>

    <div class="tabs-wrap">
      <section class="panel active" id="panel-tasks">
        <h2 class="section-title">Завдання</h2>
        <div class="task-list" id="taskList"></div>
      </section>

      <section class="panel" id="panel-refs">
        <h2 class="section-title">Реферали</h2>
        <div class="stack">
          <div class="card glass">
            <h3 class="task-title">Запрошення друга</h3>
            <p class="task-desc">Поділись посиланням бота @nightbornbot. За кожного друга — 1.00 ₴.</p>
            <p class="ref-link" id="refLink"></p>
            <button class="btn" id="copyRefBtn" type="button">Скопіювати посилання</button>
          </div>
          <div class="stats">
            <div class="card glass stat"><b id="refCount">0</b><span>запрошено</span></div>
            <div class="card glass stat"><b>1.00 ₴</b><span>за друга</span></div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-pay">
        <h2 class="section-title">Виплата</h2>
        <div class="card glass">
          <div class="field">
            <label for="amount">Сума (₴ / UAH)</label>
            <input id="amount" inputmode="decimal" placeholder="Мінімум 1.00 ₴">
          </div>
          <div class="field">
            <label for="card">Номер картки</label>
            <input id="card" inputmode="numeric" maxlength="23" placeholder="XXXX XXXX XXXX XXXX" autocomplete="cc-number">
          </div>
          <p class="error" id="payError"></p>
          <button class="btn" id="payoutBtn" type="button">Замовити виплату</button>
        </div>
      </section>
    </div>
  </main>

  <nav class="nav">
    <button class="nav-btn active" data-tab="tasks" type="button">Завдання</button>
    <button class="nav-btn" data-tab="refs" type="button">Реферали</button>
    <button class="nav-btn" data-tab="pay" type="button">Виплата</button>
  </nav>
  <div class="toast" id="toast"></div>

  <script>
    const CONFIG = {
      brand: "Night Royale 💸",
      botUsername: "nightbornbot",
      githubPages: "https://egormr111.github.io/nightbornbot/",
      channelUrl: "https://t.me/NightCapitallNc",
      channelUsername: "@NightCapitallNc",
      adminIds: [1099861854, 7641002398],
      minPayout: 1,
      refBonus: 1,
      storageKey: "night_royale_uah_v1"
    };

    const TASKS = [
      {
        id: "sub_nightcapital",
        title: "Підписка на канал",
        desc: "Підпишись на @NightCapitallNc. Нагорода 5.00 ₴ після перевірки ботом.",
        reward: 5
      },
      {
        id: "react_nightcapital",
        title: "Реакція на пост",
        desc: "Постав лайк/реакцію на останній пост @NightCapitallNc. Нагорода 2.00 ₴ після перевірки ботом.",
        reward: 2
      }
    ];

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor("#03040c");
        tg.setBackgroundColor("#03040c");
      } catch (e) {}
    }

    const haptic = (type) => {
      try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(type || "light"); } catch (e) {}
    };
    const notify = (kind) => {
      try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
    };

    const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
    const user = {
      id: tgUser.id || 0,
      firstName: tgUser.first_name || "Guest",
      lastName: tgUser.last_name || "",
      username: tgUser.username || ""
    };
    const displayName = user.username
      ? "@" + user.username
      : [user.firstName, user.lastName].filter(Boolean).join(" ") || CONFIG.brand;
    const initial = (user.firstName || user.username || "N").charAt(0).toUpperCase();
    const isAdmin = CONFIG.adminIds.includes(Number(user.id));

    document.getElementById("avatar").textContent = initial;
    document.getElementById("userName").textContent = displayName;
    document.getElementById("userId").textContent = "ID: " + (user.id || "demo");
    if (isAdmin) document.getElementById("adminChip").classList.add("show");

    const loadState = () => {
      try {
        const raw = localStorage.getItem(CONFIG.storageKey);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { balance: 0, done: {}, refs: 0 };
    };
    const saveState = (state) => localStorage.setItem(CONFIG.storageKey, JSON.stringify(state));
    let state = loadState();

    let shownBalance = state.balance;
    const balanceEl = document.getElementById("balanceValue");
    const balanceCard = document.getElementById("balanceCard");
    const formatMoney = (n) => (Math.round(n * 100) / 100).toFixed(2);
    const renderBalance = (n) => { balanceEl.textContent = formatMoney(n); };
    renderBalance(shownBalance);

    const animateBalance = (from, to) => {
      const start = performance.now();
      const dur = 700;
      const tick = (now) => {
        const t = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        shownBalance = from + (to - from) * eased;
        renderBalance(shownBalance);
        if (t < 1) requestAnimationFrame(tick);
        else { shownBalance = to; renderBalance(to); }
      };
      balanceCard.classList.remove("pulse");
      void balanceCard.offsetWidth;
      balanceCard.classList.add("pulse");
      requestAnimationFrame(tick);
    };

    const addBalance = (amount) => {
      const from = state.balance;
      state.balance = Math.round((state.balance + amount) * 100) / 100;
      saveState(state);
      animateBalance(from, state.balance);
      notify("success");
    };

    const openTg = (url) => {
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, "_blank");
    };

    const toast = (text) => {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    };

    const taskList = document.getElementById("taskList");
    const renderTasks = () => {
      taskList.innerHTML = TASKS.map((task) => {
        const done = !!state.done[task.id];
        return (
          '<article class="card glass">' +
            '<div class="task-top">' +
              "<div>" +
                '<h3 class="task-title">' + task.title + "</h3>" +
                '<p class="task-desc">' + task.desc + "</p>" +
              "</div>" +
              '<div class="reward">+' + formatMoney(task.reward) + " ₴</div>" +
            "</div>" +
            '<div class="btn-row">' +
              '<button class="btn ghost" data-open="' + task.id + '" type="button">Відкрити</button>' +
              '<button class="btn" data-check="' + task.id + '"' + (done ? " disabled" : "") + ' type="button">' +
                (done ? "Виконано" : "Перевірити") +
              "</button>" +
            "</div>" +
          "</article>"
        );
      }).join("");
    };
    renderTasks();

    taskList.addEventListener("click", (e) => {
      const openBtn = e.target.closest("[data-open]");
      if (openBtn) {
        haptic("light");
        openTg(CONFIG.channelUrl);
        toast("Відкрий " + CONFIG.channelUsername);
        return;
      }
      const checkBtn = e.target.closest("[data-check]");
      if (!checkBtn || checkBtn.disabled) return;
      haptic("medium");
      try {
        if (tg && typeof tg.sendData === "function") {
          tg.sendData(JSON.stringify({ type: "check_tasks" }));
        }
      } catch (err) {}
      openTg("https://t.me/" + CONFIG.botUsername + "?start=check_tasks");
      toast("Бот перевіряє підписку та реакцію");
    });

    const refLink = "https://t.me/" + CONFIG.botUsername + "?start=ref_" + (user.id || "guest");
    document.getElementById("refLink").textContent = refLink;
    document.getElementById("refCount").textContent = String(state.refs || 0);

    document.getElementById("copyRefBtn").addEventListener("click", async () => {
      haptic("light");
      try {
        await navigator.clipboard.writeText(refLink);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = refLink;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      toast("Посилання скопійовано");
      notify("success");
    });

    const cardInput = document.getElementById("card");
    cardInput.addEventListener("input", () => {
      const digits = cardInput.value.replace(/\D/g, "").slice(0, 19);
      cardInput.value = digits.replace(/(\d{4})(?=\d)/g, "$1 ").trim();
    });

    document.getElementById("payoutBtn").addEventListener("click", () => {
      const err = document.getElementById("payError");
      err.textContent = "";
      const amount = Number(String(document.getElementById("amount").value).replace(",", "."));
      const cardDigits = cardInput.value.replace(/\D/g, "");

      if (!amount || amount <= 0) {
        err.textContent = "Вкажи суму виплати в гривнях.";
        notify("error");
        return;
      }
      if (amount < CONFIG.minPayout) {
        err.textContent = "Мінімальна сума — 1.00 ₴.";
        notify("error");
        return;
      }
      if (amount > state.balance) {
        err.textContent = "Недостатньо коштів на балансі.";
        notify("error");
        return;
      }
      if (cardDigits.length < 16 || cardDigits.length > 19) {
        err.textContent = "Перевір номер картки (16–19 цифр).";
        notify("error");
        return;
      }

      haptic("heavy");
      const text = [
        "Заявка на виплату Night Royale",
        "user_id: " + (user.id || "demo"),
        "username: " + displayName,
        "amount: " + formatMoney(amount) + " UAH",
        "card: " + cardInput.value.trim(),
        "admin: " + (isAdmin ? "yes" : "no"),
        "pages: " + CONFIG.githubPages
      ].join("\n");

      const payloadObj = {
        type: "payout",
        user_id: user.id || 0,
        amount: formatMoney(amount),
        card: cardDigits
      };
      try {
        if (tg && typeof tg.sendData === "function") tg.sendData(JSON.stringify(payloadObj));
      } catch (e) {}

      const startPayload = ("pay_" + (user.id || "0") + "_" + Math.round(amount) + "_" + cardDigits)
        .replace(/[^a-zA-Z0-9_]/g, "")
        .slice(0, 64);
      const deepLink = "https://t.me/" + CONFIG.botUsername + "?start=" + encodeURIComponent(startPayload) + "&text=" + encodeURIComponent(text);
      openTg(deepLink);
      toast("Заявку відкрито в боті");
    });

    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b === btn));
        document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + tab));
        haptic("light");
      });
    });
  </script>
</body>
</html>
