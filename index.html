<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightBorn — Tasks & Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: rgba(10, 15, 25, 0.75);
            --card-border: rgba(0, 242, 255, 0.2);
            --neon-cyan: #00f2ff;
            --neon-glow: rgba(0, 242, 255, 0.35);
            --text-color: #ffffff;
            --text-muted: #7d8b9b;
            --success-color: #00ff88;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #05070a url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Overlay for contrast */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 10, 0.65);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .balance-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 15px var(--neon-glow);
        }

        .balance-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 800;
            margin: 8px 0;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-glow);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 8px 0 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .task-info h4 {
            margin: 0;
            font-size: 14px;
        }

        .task-info p {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--success-color);
            font-weight: 600;
        }

        .btn {
            background: linear-gradient(135deg, #00f2ff, #0066ff);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-done {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            box-shadow: none;
            cursor: default;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>NIGHTBORN 🌙🌟</h1>
        <p>Виконуй завдання та отримуй винагороду</p>
    </div>

    <div class="balance-card">
        <div class="balance-title">Твій Баланс</div>
        <div class="balance-amount" id="balance">0.00 ₴</div>
    </div>

    <div class="section-title">⚡ Активні завдання</div>

    <div class="task-list">
        <div class="task-item">
            <div class="task-info">
                <h4>Підписка на Night Capital 📢</h4>
                <p>+15.00 ₴</p>
            </div>
            <button class="btn" id="task1" onclick="completeTask('task1', 15, 'https://t.me/NightCapitallNc')">Виконати</button>
        </div>

        <div class="task-item">
            <div class="task-info">
                <h4>Перегляд спонсорського посту 🌟</h4>
                <p>+5.00 ₴</p>
            </div>
            <button class="btn" id="task2" onclick="completeTask('task2', 5, 'https://t.me/NightCapitallNc')">Виконати</button>
        </div>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let currentBalance = parseFloat(localStorage.getItem('user_balance')) || 0;
    document.getElementById('balance').innerText = currentBalance.toFixed(2) + ' ₴';

    function completeTask(taskId, reward, url) {
        if (localStorage.getItem(taskId)) return;

        window.open(url, '_blank');

        setTimeout(() => {
            currentBalance += reward;
            localStorage.setItem('user_balance', currentBalance);
            localStorage.setItem(taskId, 'true');

            document.getElementById('balance').innerText = currentBalance.toFixed(2) + ' ₴';
            
            let btn = document.getElementById(taskId);
            btn.innerText = 'Виконано ✓';
            btn.className = 'btn btn-done';
            btn.onclick = null;
        }, 2000);
    }

    // Check completed tasks
    if (localStorage.getItem('task1')) {
        let btn = document.getElementById('task1');
        btn.innerText = 'Виконано ✓';
        btn.className = 'btn btn-done';
        btn.onclick = null;
    }
    if (localStorage.getItem('task2')) {
        let btn = document.getElementById('task2');
        btn.innerText = 'Виконано ✓';
        btn.className = 'btn btn-done';
        btn.onclick = null;
    }
</script>

</body>
</html>
