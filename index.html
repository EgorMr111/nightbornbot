<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Nightborn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-0: #02040c;
      --bg-1: #071428;
      --bg-2: #0b1c3a;
      --glass: rgba(16, 28, 54, 0.48);
      --glass-strong: rgba(18, 32, 62, 0.72);
      --line: rgba(186, 230, 253, 0.28);
      --line-soft: rgba(186, 230, 253, 0.14);
      --text: #f4f7fb;
      --muted: rgba(226, 232, 240, 0.72);
      --cyan: #67e8f9;
      --cyan-deep: #22d3ee;
      --purple: #c4b5fd;
      --purple-deep: #8b5cf6;
      --ok: #86efac;
      --danger: #fda4af;
      --nav-h: 76px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; max-width: 100%; overflow-x: hidden; }
    body {
      font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      min-height: 100dvh;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(139, 92, 246, 0.28), transparent 55%),
        radial-gradient(900px 500px at -10% 20%, rgba(34, 211, 238, 0.16), transparent 50%),
        linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 48%, var(--bg-2) 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 50%, transparent 51%),
        radial-gradient(1px 1px at 72% 8%, rgba(255,255,255,.4) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 88% 32%, rgba(103,232,249,.55) 50%, transparent 51%),
        radial-gradient(1px 1px at 28% 62%, rgba(196,181,253,.5) 50%, transparent 51%),
        radial-gradient(1px 1px at 54% 78%, rgba(255,255,255,.35) 50%, transparent 51%);
      opacity: .7;
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      padding: 18px 16px calc(var(--nav-h) + var(--safe-b) + 18px);
      max-width: 480px;
      margin: 0 auto;
    }

    .badge {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(72vw, 280px);
      padding: 7px 10px 7px 7px;
      border-radius: 999px;
      background: var(--glass-strong);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.12);
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
      font-weight: 700; font-size: 14px;
      background: linear-gradient(145deg, var(--cyan), var(--purple-deep));
      color: #041018;
      flex-shrink: 0;
    }
    .badge-meta { min-width: 0; }
    .badge-name {
      font-size: 12px; font-weight: 650; line-height: 1.15;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .badge-id {
      font-size: 10px; color: var(--muted); letter-spacing: .02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .hero { padding-right: 118px; margin-bottom: 18px; }
    .kicker {
      font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--purple); margin: 0 0 6px;
    }
    h1 { margin: 0; font-size: 26px; font-weight: 720; letter-spacing: -.02em; }

    .balance-card {
      position: relative;
      overflow: hidden;
      padding: 22px 20px 18px;
      border-radius: 24px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 0 40px rgba(103, 232, 249, 0.08), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .balance-card.pulse { animation: pulseGlow .9s ease; }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 rgba(103,232,249,0); }
      40% { box-shadow: 0 0 42px rgba(103,232,249,.45); }
      100% { box-shadow: 0 0 40px rgba(103,232,249,.08); }
    }
    .balance-label { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
    .balance-row { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
    .balance-value {
      font-size: 42px; font-weight: 760; letter-spacing: -.04em; line-height: 1;
      background: linear-gradient(90deg, #fff, var(--cyan), var(--purple));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .balance-unit { color: var(--cyan); font-weight: 650; font-size: 16px; }
    .balance-hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
    .admin-chip {
      display: none;
      margin-top: 12px;
      width: fit-content;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      color: var(--purple);
      border: 1px solid rgba(196,181,253,.4);
      background: rgba(139, 92, 246, .12);
    }
    .admin-chip.show { display: inline-flex; }

    .tabs-wrap { margin-top: 18px; }
    .panel { display: none; animation: fadeSlide .28s ease; }
    .panel.active { display: block; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .section-title { margin: 0 0 12px; font-size: 15px; font-weight: 650; }
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      padding: 16px;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid var(--line-soft);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .task-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .task-title { margin: 0; font-size: 15px; font-weight: 680; }
    .task-desc { margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
    .reward {
      flex-shrink: 0;
      font-size: 12px; font-weight: 700; color: var(--cyan);
      padding: 4px 8px; border-radius: 999px;
      border: 1px solid rgba(103,232,249,.35);
      background: rgba(34,211,238,.08);
    }
    .btn {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px; font-weight: 700;
      color: #041018;
      background: linear-gradient(135deg, var(--cyan) 0%, #a78bfa 100%);
      box-shadow: 0 0 22px rgba(34, 211, 238, .28);
      cursor: pointer;
    }
    .btn:disabled {
      cursor: default;
      color: var(--ok);
      background: rgba(134, 239, 172, .12);
      border: 1px solid rgba(134, 239, 172, .28);
      box-shadow: none;
    }
    .ghost {
      color: var(--text);
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .ref-link {
      margin: 0;
      word-break: break-all;
      font-size: 13px;
      color: var(--cyan);
      line-height: 1.45;
    }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .stat { padding: 14px; text-align: center; }
    .stat b { display: block; font-size: 22px; color: var(--cyan); }
    .stat span { font-size: 11px; color: var(--muted); }

    label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .field { margin-bottom: 12px; }
    input {
      width: 100%;
      border: 1px solid var(--line-soft);
      background: rgba(2, 8, 20, .45);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.12); }
    .error { min-height: 18px; margin: 0 0 8px; font-size: 12px; color: var(--danger); }

    .nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px 12px calc(10px + var(--safe-b));
      background: rgba(4, 8, 18, .72);
      border-top: 1px solid var(--line-soft);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .nav-btn {
      border: 0; background: transparent; color: var(--muted);
      padding: 10px 6px; border-radius: 14px;
      font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .nav-btn.active {
      color: var(--text);
      background: linear-gradient(180deg, rgba(34,211,238,.16), rgba(139,92,246,.12));
      box-shadow: 0 0 16px rgba(103,232,249,.12);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--glass-strong);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      font-size: 13px;
      white-space: nowrap;
      transition: .28s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="badge" id="profileBadge">
    <div class="avatar" id="avatar">N</div>
    <div class="badge-meta">
      <div class="badge-name" id="userName">Nightborn</div>
      <div class="badge-id" id="userId">ID: —</div>
    </div>
  </div>

  <main class="app">
    <header class="hero">
      <p class="kicker">Moonlight Glow</p>
      <h1>Nightborn</h1>
    </header>

    <section class="balance-card" id="balanceCard">
      <p class="balance-label">Баланс</p>
      <div class="balance-row">
        <div class="balance-value" id="balanceValue">0.00</div>
        <div class="balance-unit">NC</div>
      </div>
      <p class="balance-hint">Виконуй завдання, запрошуй друзів, виводь кошти.</p>
      <div class="admin-chip" id="adminChip">Адмін-доступ активний</div>
    </section>

    <div class="tabs-wrap">
      <section class="panel active" id="panel-tasks">
        <h2 class="section-title">Завдання</h2>
        <div class="task-list" id="taskList"></div>
      </section>

      <section class="panel" id="panel-refs">
        <h2 class="section-title">Реферали</h2>
        <div class="card">
          <p class="task-desc">Твоє унікальне посилання. Друг запускає бота — ти отримуєш бонус.</p>
          <p class="ref-link" id="refLink"></p>
          <button class="btn" id="copyRefBtn" type="button">Скопіювати посилання</button>
        </div>
        <div class="stats">
          <div class="card stat"><b id="refCount">0</b><span>запрошено</span></div>
          <div class="card stat"><b>+25</b><span>NC за друга</span></div>
        </div>
      </section>

      <section class="panel" id="panel-pay">
        <h2 class="section-title">Виплата</h2>
        <div class="card">
          <div class="field">
            <label for="amount">Сума (NC)</label>
            <input id="amount" inputmode="decimal" placeholder="Мінімум 50">
          </div>
          <div class="field">
            <label for="card">Номер картки</label>
            <input id="card" inputmode="numeric" maxlength="23" placeholder="XXXX XXXX XXXX XXXX" autocomplete="cc-number">
          </div>
          <p class="error" id="payError"></p>
          <button class="btn" id="payoutBtn" type="button">Замовити виплату</button>
        </div>
      </section>
    </div>
  </main>

  <nav class="nav">
    <button class="nav-btn active" data-tab="tasks" type="button">Завдання</button>
    <button class="nav-btn" data-tab="refs" type="button">Реферали</button>
    <button class="nav-btn" data-tab="pay" type="button">Виплата</button>
  </nav>
  <div class="toast" id="toast"></div>

  <script>
    const CONFIG = {
      botUsername: "nightbornbot",
      githubPages: "https://egormr111.github.io/nightbornbot/",
      channelUrl: "https://t.me/NightCapitallNc",
      adminIds: [1099861854, 7641002398],
      minPayout: 50,
      storageKey: "nightborn_miniapp_v1"
    };

    const TASKS = [
      {
        id: "sub_nightcapital",
        title: "Підписка на канал",
        desc: "Відкрий @NightCapitallNc і підпишись на канал.",
        reward: 15
      },
      {
        id: "react_nightcapital",
        title: "Реакції в каналі",
        desc: "Постав реакції на останні пости NightCapitallNc.",
        reward: 10
      },
      {
        id: "read_nightcapital",
        title: "Переглянь закріп",
        desc: "Відкрий канал і ознайомся з правилами в закріпленому пості.",
        reward: 8
      }
    ];

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor("#02040c");
        tg.setBackgroundColor("#02040c");
      } catch (e) {}
    }

    const haptic = (type) => {
      try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(type || "light"); } catch (e) {}
    };
    const notify = (kind) => {
      try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
    };

    const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
    const user = {
      id: tgUser.id || 0,
      firstName: tgUser.first_name || "Guest",
      lastName: tgUser.last_name || "",
      username: tgUser.username || ""
    };
    const displayName = user.username
      ? "@" + user.username
      : [user.firstName, user.lastName].filter(Boolean).join(" ") || "Guest";
    const initial = (user.firstName || user.username || "N").charAt(0).toUpperCase();
    const isAdmin = CONFIG.adminIds.includes(Number(user.id));

    document.getElementById("avatar").textContent = initial;
    document.getElementById("userName").textContent = displayName;
    document.getElementById("userId").textContent = "ID: " + (user.id || "demo");
    if (isAdmin) document.getElementById("adminChip").classList.add("show");

    const loadState = () => {
      try {
        const raw = localStorage.getItem(CONFIG.storageKey);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { balance: 0, done: {}, refs: 0 };
    };
    const saveState = (state) => {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(state));
    };
    let state = loadState();

    let shownBalance = state.balance;
    const balanceEl = document.getElementById("balanceValue");
    const balanceCard = document.getElementById("balanceCard");

    const formatMoney = (n) => (Math.round(n * 100) / 100).toFixed(2);

    const renderBalance = (n) => { balanceEl.textContent = formatMoney(n); };
    renderBalance(shownBalance);

    const animateBalance = (from, to) => {
      const start = performance.now();
      const dur = 700;
      const tick = (now) => {
        const t = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        shownBalance = from + (to - from) * eased;
        renderBalance(shownBalance);
        if (t < 1) requestAnimationFrame(tick);
        else {
          shownBalance = to;
          renderBalance(to);
        }
      };
      balanceCard.classList.remove("pulse");
      void balanceCard.offsetWidth;
      balanceCard.classList.add("pulse");
      requestAnimationFrame(tick);
    };

    const addBalance = (amount) => {
      const from = state.balance;
      state.balance = Math.round((state.balance + amount) * 100) / 100;
      saveState(state);
      animateBalance(from, state.balance);
      notify("success");
    };

    const openTg = (url) => {
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, "_blank");
    };

    const toast = (text) => {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    };

    const taskList = document.getElementById("taskList");
    const renderTasks = () => {
      taskList.innerHTML = TASKS.map((task) => {
        const done = !!state.done[task.id];
        return `
          <article class="card">
            <div class="task-top">
              <div>
                <h3 class="task-title">${task.title}</h3>
                <p class="task-desc">${task.desc}</p>
              </div>
              <div class="reward">+${task.reward} NC</div>
            </div>
            <button class="btn" data-task="${task.id}" ${done ? "disabled" : ""} type="button">
              ${done ? "Виконано" : "Виконати"}
            </button>
          </article>`;
      }).join("");
    };
    renderTasks();

    taskList.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-task]");
      if (!btn || btn.disabled) return;
      const id = btn.getAttribute("data-task");
      const task = TASKS.find((t) => t.id === id);
      if (!task || state.done[id]) return;
      haptic("medium");
      openTg(CONFIG.channelUrl);
      state.done[id] = true;
      saveState(state);
      addBalance(task.reward);
      renderTasks();
      toast("Нагороду зараховано");
    });

    const refLink = `https://t.me/${CONFIG.botUsername}?start=ref_${user.id || "guest"}`;
    document.getElementById("refLink").textContent = refLink;
    document.getElementById("refCount").textContent = String(state.refs || 0);

    document.getElementById("copyRefBtn").addEventListener("click", async () => {
      haptic("light");
      try {
        await navigator.clipboard.writeText(refLink);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = refLink;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      toast("Посилання скопійовано");
      notify("success");
    });

    const cardInput = document.getElementById("card");
    cardInput.addEventListener("input", () => {
      const digits = cardInput.value.replace(/\D/g, "").slice(0, 19);
      cardInput.value = digits.replace(/(\d{4})(?=\d)/g, "$1 ").trim();
    });

    document.getElementById("payoutBtn").addEventListener("click", () => {
      const err = document.getElementById("payError");
      err.textContent = "";
      const amount = Number(String(document.getElementById("amount").value).replace(",", "."));
      const cardDigits = cardInput.value.replace(/\D/g, "");

      if (!amount || amount <= 0) {
        err.textContent = "Вкажи суму виплати.";
        notify("error");
        return;
      }
      if (amount < CONFIG.minPayout) {
        err.textContent = "Мінімальна сума — " + CONFIG.minPayout + " NC.";
        notify("error");
        return;
      }
      if (amount > state.balance) {
        err.textContent = "Недостатньо коштів на балансі.";
        notify("error");
        return;
      }
      if (cardDigits.length < 16 || cardDigits.length > 19) {
        err.textContent = "Перевір номер картки (16–19 цифр).";
        notify("error");
        return;
      }

      haptic("heavy");
      const text = [
        "Заявка на виплату Nightborn",
        "user_id: " + (user.id || "demo"),
        "username: " + displayName,
        "amount: " + formatMoney(amount) + " NC",
        "card: " + cardInput.value.trim(),
        "admin: " + (isAdmin ? "yes" : "no"),
        "pages: " + CONFIG.githubPages
      ].join("\n");

      const startPayload = ("pay_" + (user.id || "0") + "_" + Math.round(amount)).replace(/[^a-zA-Z0-9_]/g, "").slice(0, 64);
      const deepLink = `https://t.me/${CONFIG.botUsername}?start=${encodeURIComponent(startPayload)}&text=${encodeURIComponent(text)}`;
      openTg(deepLink);
      toast("Заявку надіслано боту");
      if (isAdmin) toast("Адмін: заявка відкрита");
    });

    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b === btn));
        document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + tab));
        haptic("light");
      });
    });
  </script>
</body>
</html>
